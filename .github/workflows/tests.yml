name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Compile Python source
        run: uv run python -m compileall -q echo.py

      - name: Run echo smoke test
        run: |
          uv run python - <<'PY'
          from echo import app

          with app.test_client() as client:
              response = client.post('/', data=b'hello')
              assert response.status_code == 200
              assert response.data == b'hello'
          PY

      - name: Build Docker image
        run: docker build --build-arg PYTHON_VERSION=3.14 .

    timeout-minutes: 10
